<html lang="pt" data-theme="light">
<head>

<style>

/* ============================================
   DESIGN SYSTEM - Minimalista Profissional
   ============================================ */
:root{
  --bg:#fafbfc;
  --surface:#ffffff;
  --surface-2:#f1f5f9;
  --ink:#0a0f1a;
  --ink-2:#334155;
  --mut:#64748b;
  --line:#e2e8f0;
  --acc:#059669;
  --acc-light:#10b981;
  --acc-d:#047857;
  --acc-glow:rgba(5,150,105,0.12);
  --red:#e11d48;
  --red-light:#fb7185;
  --amb:#d97706;
  --amb-light:#fbbf24;
  --grn:#059669;
  --grn-light:#34d399;
  --blu:#2563eb;
  --blu-light:#60a5fa;
  --pur:#7c3aed;
  --pur-light:#a78bfa;
  --sh-xs:0 1px 2px rgba(0,0,0,0.04);
  --sh-sm:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --sh-md:0 4px 6px -1px rgba(0,0,0,0.05),0 2px 4px -1px rgba(0,0,0,0.03);
  --sh-lg:0 10px 15px -3px rgba(0,0,0,0.08),0 4px 6px -2px rgba(0,0,0,0.03);
  --sh-xl:0 20px 25px -5px rgba(0,0,0,0.08),0 10px 10px -5px rgba(0,0,0,0.02);
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:24px;
  --r-full:9999px;
  --font:"Inter","SF Pro Display","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",monospace;
  --t-fast:150ms cubic-bezier(0.4,0,0.2,1);
  --t-med:250ms cubic-bezier(0.4,0,0.2,1);
  --t-slow:350ms cubic-bezier(0.4,0,0.2,1);
}
/* Tema escuro apenas quando explicitamente definido via data-theme="dark" */
:root[data-theme="dark"]{
  --bg:#0a0e14;
  --surface:#111827;
  --surface-2:#1e293b;
  --ink:#f8fafc;
  --ink-2:#cbd5e1;
  --mut:#94a3b8;
  --line:#1e293b;
  --acc:#10b981;
  --acc-light:#34d399;
  --acc-d:#059669;
  --acc-glow:rgba(16,185,129,0.15);
  --sh-xs:0 1px 2px rgba(0,0,0,0.2);
  --sh-sm:0 1px 3px rgba(0,0,0,0.3),0 1px 2px rgba(0,0,0,0.2);
  --sh-md:0 4px 6px -1px rgba(0,0,0,0.3),0 2px 4px -1px rgba(0,0,0,0.2);
  --sh-lg:0 10px 15px -3px rgba(0,0,0,0.4),0 4px 6px -2px rgba(0,0,0,0.2);
  --sh-xl:0 20px 25px -5px rgba(0,0,0,0.5),0 10px 10px -5px rgba(0,0,0,0.2);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
main{
  padding:24px 20px 140px;
  display:flex;
  flex-direction:column;
  gap:16px;
  max-width:480px;
  margin:0 auto;
}
.card{
  background:var(--surface);
  border-radius:var(--r-lg);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:14px;
  box-shadow:var(--sh-sm);
  transition:box-shadow var(--t-med),transform var(--t-fast);
  border:1px solid var(--line);
}
.card:hover{box-shadow:var(--sh-md)}
.card.press{cursor:pointer}
.card.press:active{transform:scale(0.98)}
.glass{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:var(--r-md);
  padding:14px 16px;
}
h1{font-size:24px;font-weight:700;letter-spacing:-0.03em;line-height:1.2}
h2{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:0.08em}
.mut{color:var(--mut);font-size:13px;line-height:1.6}
.big{font-size:32px;font-weight:700;letter-spacing:-0.03em;line-height:1.1}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hero{
  background:linear-gradient(135deg,#064e3b 0%,#059669 50%,#10b981 100%);
  color:#fff;
  border-radius:var(--r-xl);
  padding:24px;
  display:flex;
  align-items:center;
  gap:20px;
  box-shadow:var(--sh-xl),inset 0 1px 0 rgba(255,255,255,0.1);
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';
  position:absolute;
  top:-50%;right:-30%;
  width:280px;height:280px;
  background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);
  border-radius:50%;
}
.hero::after{
  content:'';
  position:absolute;
  bottom:-60%;left:-20%;
  width:200px;height:200px;
  background:radial-gradient(circle,rgba(255,255,255,0.08) 0%,transparent 70%);
  border-radius:50%;
}
.hero-content{position:relative;z-index:1;flex:1}
.hero-stats{display:flex;flex-direction:column;gap:10px;font-size:12px;opacity:0.9}
.hero-stats b{display:block;font-size:16px;font-weight:600;letter-spacing:-0.01em}
.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:600;
  padding:6px 12px;
  border-radius:var(--r-full);
  background:var(--surface-2);
  color:var(--ink-2);
  border:1px solid var(--line);
}
.chip.on{background:var(--acc-glow);color:var(--acc);border-color:transparent}
.chip.warn{background:rgba(217,119,6,0.1);color:var(--amb);border-color:transparent}
.chip.danger{background:rgba(225,29,72,0.1);color:var(--red);border-color:transparent}
.badge{
  font-size:10px;
  font-weight:700;
  padding:4px 10px;
  border-radius:var(--r-full);
  background:var(--surface-2);
  color:var(--mut);
  letter-spacing:0.04em;
  text-transform:uppercase;
}
.badge.ok{background:var(--acc-glow);color:var(--acc)}
.badge.over{background:rgba(225,29,72,0.1);color:var(--red)}
.bar{
  height:8px;
  border-radius:var(--r-full);
  background:var(--surface-2);
  overflow:hidden;
  position:relative;
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--acc),var(--acc-light));
  border-radius:var(--r-full);
  transition:width var(--t-slow) cubic-bezier(0.34,1.56,0.64,1);
  position:relative;
}
.bar i::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
  animation:shimmer 2s infinite;
}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{padding:16px;gap:8px}
.grid b{font-size:22px;font-weight:700;letter-spacing:-0.02em}
input,textarea,select{
  font:inherit;
  font-size:15px;
  padding:14px 16px;
  border-radius:var(--r-md);
  border:1.5px solid var(--line);
  background:var(--surface);
  color:var(--ink);
  width:100%;
  transition:all var(--t-fast);
  outline:none;
}
input:focus,textarea:focus,select:focus{
  border-color:var(--acc);
  box-shadow:0 0 0 4px var(--acc-glow);
}
input::placeholder{color:var(--mut);opacity:0.6}
textarea{resize:vertical;font-family:var(--font-mono);font-size:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cats button{
  font:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--ink-2);
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:var(--r-md);
  padding:14px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  cursor:pointer;
  transition:all var(--t-fast);
}
.cats button span{font-size:24px;transition:transform var(--t-fast)}
.cats button:hover{border-color:var(--acc);background:var(--acc-glow);transform:translateY(-2px)}
.cats button:hover span{transform:scale(1.1)}
.cats button:active{transform:scale(0.96)}
.cats button.sel{
  border-color:var(--acc);
  background:var(--acc-glow);
  box-shadow:0 0 0 3px var(--acc-glow);
}
.btn{
  font:inherit;
  font-weight:600;
  font-size:14px;
  border:0;
  border-radius:var(--r-md);
  padding:14px 20px;
  background:var(--acc);
  color:#fff;
  cursor:pointer;
  transition:all var(--t-fast);
  box-shadow:var(--sh-sm),0 1px 3px rgba(5,150,105,0.3);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.btn:hover{background:var(--acc-d);transform:translateY(-1px);box-shadow:var(--sh-md),0 4px 12px rgba(5,150,105,0.35)}
.btn:active{transform:scale(0.97)}
.btn.sm{padding:10px 16px;font-size:13px}
.btn.alt{
  background:var(--surface);
  color:var(--ink);
  border:1.5px solid var(--line);
  box-shadow:none;
}
.btn.alt:hover{background:var(--surface-2);border-color:var(--mut)}
.btn.warn{background:var(--red);box-shadow:0 1px 3px rgba(225,29,72,0.3)}
.btn.warn:hover{background:#be123c}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.row{display:flex;align-items:center;gap:14px;justify-content:space-between}
.row .n{flex:1;min-width:0}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.x{
  background:none;
  border:0;
  font-size:18px;
  padding:8px;
  color:var(--mut);
  cursor:pointer;
  border-radius:var(--r-sm);
  transition:all var(--t-fast);
  opacity:0.5;
}
.x:hover{opacity:1;background:var(--surface-2);color:var(--red)}
.lbl{font-size:12px;color:var(--mut);font-weight:600;letter-spacing:0.03em}
.leg{display:flex;flex-direction:column;gap:10px;flex:1;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:10px}
.evo{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:20px}
.evo div{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  height:100%;
  font-size:11px;
  color:var(--mut);
  font-weight:500;
}
.evo i{
  width:100%;
  max-width:32px;
  border-radius:6px 6px 3px 3px;
  background:var(--surface-2);
  min-height:4px;
  transition:height var(--t-slow) cubic-bezier(0.34,1.56,0.64,1);
}
.evo .cur i{background:linear-gradient(180deg,var(--acc-light),var(--acc));box-shadow:0 2px 8px rgba(5,150,105,0.3)}
.evo .val{font-size:10px;font-weight:700;color:var(--ink-2)}
.mn{display:flex;align-items:center;justify-content:space-between}
.mn button{
  background:var(--surface);
  border:1.5px solid var(--line);
  color:var(--ink);
  border-radius:var(--r-md);
  width:40px;
  height:38px;
  font-size:18px;
  cursor:pointer;
  transition:all var(--t-fast);
  box-shadow:var(--sh-xs);
  display:flex;
  align-items:center;
  justify-content:center;
}
.mn button:hover:not(:disabled){border-color:var(--acc);color:var(--acc);background:var(--acc-glow)}
.mn button:disabled{opacity:0.3;cursor:default}
.mn b{text-transform:capitalize;font-size:16px;font-weight:600}
nav{
  position:fixed;
  left:0;right:0;bottom:0;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -4px 24px rgba(0,0,0,0.06);
  z-index:40;
}
nav button{
  flex:1;
  font:inherit;
  font-size:10px;
  font-weight:600;
  color:var(--mut);
  background:none;
  border:0;
  padding:12px 0 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
  transition:color var(--t-fast);
  position:relative;
}
nav button span{font-size:22px;filter:grayscale(0.5);transition:all var(--t-fast)}
nav button.on{color:var(--acc)}
nav button.on span{filter:none;transform:translateY(-2px)}
nav button.on::before{
  content:'';
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:3px;
  background:var(--acc);
  border-radius:0 0 4px 4px;
}
#toast{
  position:fixed;
  left:20px;right:20px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  background:var(--ink);
  color:var(--surface);
  border-radius:var(--r-md);
  padding:14px 18px;
  font-size:14px;
  font-weight:500;
  display:none;
  justify-content:space-between;
  align-items:center;
  max-width:440px;
  margin:0 auto;
  z-index:50;
  box-shadow:var(--sh-xl);
}
#toast.on{display:flex;animation:toastIn var(--t-med) cubic-bezier(0.34,1.56,0.64,1)}
#toast button{background:none;border:0;color:var(--acc-light);font:inherit;font-weight:600;cursor:pointer;font-size:14px}
@keyframes toastIn{from{transform:translateY(16px) scale(0.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.ob{min-height:80vh;justify-content:center;align-items:center;text-align:center;gap:20px}
.ob .emoji{font-size:56px;margin-bottom:8px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.1))}
dialog{
  border:0;
  border-radius:var(--r-xl);
  background:var(--surface);
  color:var(--ink);
  padding:28px;
  width:min(92vw,420px);
  box-shadow:var(--sh-xl);
}
dialog::backdrop{background:rgba(0,0,0,0.5);backdrop-filter:blur(8px)}
dialog h2{font-size:18px;text-transform:none;letter-spacing:-0.02em;color:var(--ink);margin-bottom:16px}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  font-weight:600;
  color:var(--mut);
  background:var(--surface);
  border:1.5px solid var(--line);
  border-radius:var(--r-full);
  padding:8px 14px;
  cursor:pointer;
  transition:all var(--t-fast);
}
.pill:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-glow)}
.mov{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 14px;
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all var(--t-fast);
  border:1px solid transparent;
}
.mov:hover{background:var(--surface-2);border-color:var(--line)}
.mov .ic{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  background:var(--surface-2);
  flex-shrink:0;
}
.apphead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 0}
.apphead h1{margin:0}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-0.02em}
.stat .l{font-size:11px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:0.05em}
.sep{height:1px;background:var(--line);margin:8px 0}
::-webkit-scrollbar{width:0;height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{animation:fadeUp var(--t-med) ease}
.skel{
  background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);
  background-size:200% 100%;
  animation:skel 1.5s infinite;
  border-radius:var(--r-sm);
}
@keyframes skel{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:0.01ms!important;transition-duration:0.01ms!important}}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:4px}
.fab{
  position:fixed;
  right:20px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  width:60px;
  height:60px;
  border-radius:var(--r-full);
  background:var(--acc);
  color:#fff;
  border:0;
  font-size:28px;
  cursor:pointer;
  box-shadow:var(--sh-lg),0 4px 20px rgba(5,150,105,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all var(--t-fast);
  z-index:30;
}
.fab:hover{transform:scale(1.08) rotate(90deg);box-shadow:var(--sh-xl),0 6px 24px rgba(5,150,105,0.5)}
.fab:active{transform:scale(0.92)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal div{
  aspect-ratio:1;
  border-radius:8px;
  background:var(--surface-2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:600;
  color:var(--mut);
  transition:all var(--t-fast);
  cursor:pointer;
}
.cal div:hover{transform:scale(1.12);box-shadow:var(--sh-sm)}
.cal div.l1{background:rgba(5,150,105,0.15);color:var(--acc)}
.cal div.l2{background:rgba(5,150,105,0.3);color:var(--acc-d)}
.cal div.l3{background:rgba(5,150,105,0.5);color:#fff}
.cal div.l4{background:rgba(5,150,105,0.7);color:#fff}
.cal div.l5{background:var(--acc);color:#fff}
.cal div.fut{opacity:0.25;cursor:default}
.cal div.fut:hover{transform:none;box-shadow:none}
.cal div.today{outline:2.5px solid var(--acc);outline-offset:-2.5px;font-weight:700}
.insight{
  display:flex;
  gap:14px;
  padding:16px;
  border-radius:var(--r-md);
  background:var(--surface-2);
  border-left:4px solid var(--acc);
}
.insight.warn{border-left-color:var(--amb);background:rgba(217,119,6,0.06)}
.insight.danger{border-left-color:var(--red);background:rgba(225,29,72,0.06)}
.insight .ic{font-size:22px}
.insight .tx{flex:1;font-size:13px;line-height:1.6;color:var(--ink-2)}
.insight .tx b{color:var(--ink)}
.cmp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.cmp .up{color:var(--red)}
.cmp .down{color:var(--grn)}
.tgl{
  position:relative;
  width:48px;
  height:26px;
  background:var(--surface-2);
  border-radius:var(--r-full);
  cursor:pointer;
  transition:background var(--t-fast);
  border:0;
}
.tgl::after{
  content:'';
  position:absolute;
  top:2px;
  left:2px;
  width:22px;
  height:22px;
  background:#fff;
  border-radius:50%;
  transition:transform var(--t-fast);
  box-shadow:var(--sh-sm);
}
.tgl.on{background:var(--acc)}
.tgl.on::after{transform:translateX(22px)}
.empty{text-align:center;padding:40px 24px;color:var(--mut)}
.empty .ic{font-size:48px;margin-bottom:12px;opacity:0.4}
.empty .t{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.empty .d{font-size:13px}
.streak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--amb)}
.streak.hot{color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.proj{display:flex;flex-direction:column;gap:10px}
.proj .row{padding:12px 0;border-bottom:1px solid var(--line)}
.proj .row:last-child{border-bottom:0}
.area{position:relative;height:100px}
.area svg{width:100%;height:100%}
.area .val{
  position:absolute;
  top:8px;
  right:12px;
  font-size:12px;
  font-weight:700;
  color:var(--acc);

/* Wrapper seguro para Google Sites (funciona mesmo se cookies de terceiros estiverem bloqueados no iframe) */
const MEM_STORE={};
const GS={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return MEM_STORE[k]||null},
  set(k,v){MEM_STORE[k]=String(v);try{localStorage.setItem(k,String(v))}catch(e){}},
  del(k){delete MEM_STORE[k];try{localStorage.removeItem(k)}catch(e){}},
  sGet(k){try{const v=sessionStorage.getItem(k);if(v!==null)return v}catch(e){}return MEM_STORE['s_'+k]||null},
  sSet(k,v){MEM_STORE['s_'+k]=String(v);try{sessionStorage.setItem(k,String(v))}catch(e){}},
  sDel(k){delete MEM_STORE['s_'+k];try{sessionStorage.removeItem(k)}catch(e){}}
};

let ROLE=(()=>{
  let h='',t='',l='';
  try{h=(location.hash||'').replace('#','')}catch(e){}
  t=GS.sGet('poupar-tmp')||'';
  l=GS.get('poupar-role')||'';
  if(h==='tv')return'tv';
  if(t==='nuno'||t==='anelise'||t==='tv')return t;
  if(t==='lock')return'';
  return l==='tv'?'tv':'';
})();

}

/* ---------- migração e carregamento de perfil ---------- */
function loadProfileState(){
  K='poupar-v5-'+(ROLE||'x');
  S=emptyState();
  try{
    const r=GS.get(K);
    if(r)Object.assign(S,JSON.parse(r));
    else{
      const keys=['poupar-v4','poupar-v3','poupar-v2','poupar-v1'];
      for(const k of keys){
        const d=GS.get(k);
        if(d){Object.assign(S,JSON.parse(d));if(k==='poupar-v1')S.ex=(S.ex||[]).map(e=>({...e,c:e.c===4?5:e.c}));break;}
      }
      S.ob=S.inc?1:0;

}

function calcFor(st){
  const now=new Date(),td=iso(now),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dayN=now.getDate(),left=dim-dayN+1;
  const fixed=sum(st.fixed),m=(st.ex||[]).filter(e=>e.t&&e.t.startsWith(mkey(0))),spent=sum(m),sToday=sum(m.filter(e=>e.t===td)),budget=(st.inc||0)-fixed-(st.goal||0);
  const remaining=budget-spent;
  const B=budget/dim,nDays=dayN,carry=B*(nDays-1)-(spent-sToday),allow=B+carry;
  const leftToday=allow-sToday;
  const rollover=carry;
  return{td,dim,dayN,left,fixed,m,spent,sToday,budget,allow,leftToday,remaining,rollover,base:B,pace:(st.inc||0)-fixed-(spent/dayN)*dim};
}

function streakFor(st,c){
  if(!(st.ex||[]).length||c.budget<=0)return 0;
  const L=c.budget/c.dim,by={};st.ex.forEach(e=>by[e.t]=(by[e.t]||0)+e.a);
  const first=st.ex.map(e=>e.t).sort()[0],d=new Date();let n=0;
  for(let i=0;i<400;i++){const k=iso(d);if(k<first)break;if((by[k]||0)<=L)n++;else break;d.setDate(d.getDate()-1)}
  return n;
}

}

  return{mk:mkey(0),inc:st.inc,fixed:c.fixed,goal:st.goal,budget:c.budget,spent:c.spent,dayN:c.dayN,dim:c.dim,cats:cs,
    hist:[-5,-4,-3,-2,-1,0].map(o=>sum((st.ex||[]).filter(e=>e.t&&e.t.startsWith(mkey(o))))),streak:streakFor(st,c),
    saved:(st.goals||[]).reduce((s,g)=>s+g.s,0),goalsT:(st.goals||[]).reduce((s,g)=>s+g.t,0),upd:st.savedAt||Date.now(),left:c.leftToday,allow:c.allow,sToday:c.sToday,recent:[...(st.ex||[])].sort((a,b)=>b.id-a.id).slice(0,4).map(e=>({id:e.id,c:e.c,a:e.a,t:e.t}))};

function mySummary(){return summaryForState(S)}

}

}
const who=id=>({nuno:'Nuno',anelise:'Anelise'}[id]||id);

function exportPartnerSync(){
  const payload=JSON.stringify({role:ROLE,sum:mySummary(),data:S});
  const inp=$('syncp');if(inp){inp.value=payload;inp.select()}
  copyTextSafe(payload);
  toast('Resumo de '+who(ROLE)+' copiado! Envia para o outro telemóvel.');
}
function importPartnerSync(){
  const inp=$('syncp');if(!inp||!inp.value.trim()){toast('Cola primeiro o código');return}
  try{
    const p=JSON.parse(inp.value.trim());
    if(p.role&&['nuno','anelise'].includes(p.role)){
      if(p.data)GS.set('poupar-v5-'+p.role,JSON.stringify(p.data));
      if(p.sum)PEERS[p.role]=p.sum;
      syncLocalPeers();
      inp.value='';render();
      toast('Dados de '+who(p.role)+' sincronizados!');
    }else toast('Código inválido');
  }catch(e){toast('Código inválido')}
}

  </div>`;

  const ids=Object.keys(PEERS).sort((a,b)=>(b===ROLE)-(a===ROLE)||(a<b?-1:1));
  const P=ids.map((id,i)=>{const p=PEERS[id]||{};return{id,col:PCOL[id==='nuno'?0:1],n:who(id),inc:num(p.inc),goal:num(p.goal),budget:num(p.budget),spent:num(p.spent),dayN:Math.max(1,num(p.dayN)),
    cats:CATS.map((_,k)=>num(Array.isArray(p.cats)?p.cats[k]:0)),hist:[0,1,2,3,4,5].map(k=>num(Array.isArray(p.hist)?p.hist[k]:0)),
    streak:num(p.streak),saved:num(p.saved),upd:num(p.upd),old:!!p.mk&&String(p.mk)!==mkey(0)}});
  if(P.length<2){
    return head+`<div class="card"><div class="empty"><div class="ic">⏳</div><div class="t">À espera da outra pessoa</div><div class="d">Configura o perfil de ${ROLE==='nuno'?'Anelise':'Nuno'} ou importa o código abaixo para veres a comparação completa.</div></div></div>`+syncCard;
  }
  const dot=p=>`<span class="who"><i class="pdot" style="background:${p.col}"></i>${esc(p.n)}</span>`;
  const metric=(title,fn,fmt,cap)=>{const vs=P.map(fn),mx=cap||Math.max(1,...vs);
    return `<div class="card"><h2>${title}</h2>${P.map((p,i)=>`<div class="mrow">${dot(p)}<div class="bar"><i style="width:${Math.min(100,Math.max(0,vs[i])/mx*100)}%;background:${p.col}"></i></div><b class="num" style="font-size:13px">${fmt(vs[i])}</b></div>`).join('')}</div>`};
  const tot=f=>P.reduce((s,p)=>s+f(p),0);
  const together=`<div class="hero" style="flex-direction:column;align-items:stretch;gap:14px">
    <div class="hero-content"><div style="font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.05em">Juntos este mês</div><div class="big num" style="margin-top:4px">${eur(tot(p=>p.spent),0)}</div><div style="font-size:12px;opacity:.8">gastos de ${P.map(p=>esc(p.n)).join(' + ')}</div></div>
    <div class="hero-stats" style="flex-direction:row;gap:10px;position:relative;z-index:1">
      <div class="glass" style="flex:1"><div style="font-size:11px;opacity:.8">Ainda livre</div><b>${eur(tot(p=>p.budget-p.spent),0)}</b></div>
      <div class="glass" style="flex:1"><div style="font-size:11px;opacity:.8">Meta/mês</div><b>${eur(tot(p=>p.goal),0)}</b></div>
      <div class="glass" style="flex:1"><div style="font-size:11px;opacity:.8">Em objetivos</div><b>${eur(tot(p=>p.saved),0)}</b></div>
    </div></div>`;
  const people=`<div class="card"><h2>Quem está a comparar</h2>${P.map(p=>`<div class="row">${dot(p)}<span class="mut" style="font-size:11px">${p.old?'<span class="chip warn">dados de outro mês</span> ':''}atualizado ${p.upd?new Date(p.upd).toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'}):'—'}</span></div>`).join('')}</div>`;
  const catRows=CATS.map((x,k)=>{const vs=P.map(p=>p.cats[k]),mx=Math.max(...vs);if(mx<=0)return'';
    return `<div style="padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px"><div style="font-weight:600;font-size:14px">${x[0]} ${x[1]}</div>${P.map((p,i)=>`<div class="mrow">${dot(p)}<div class="bar"><i style="width:${vs[i]/mx*100}%;background:${p.col}"></i></div><span class="num" style="font-size:12px">${eur(vs[i],0)} <small class="mut">${p.spent>0?Math.round(vs[i]/p.spent*100):0}%</small></span></div>`).join('')}</div>`}).join('');
  const hmx=Math.max(1,...P.flatMap(p=>p.hist));
  const hist=`<div class="card"><h2>Últimos 6 meses</h2><div class="row" style="justify-content:flex-start;gap:14px;flex-wrap:wrap">${P.map(dot).join('')}</div>
    <div class="hist">${[-5,-4,-3,-2,-1,0].map((o,k)=>`<div><div class="bs">${P.map(p=>`<i title="${eur(p.hist[k],0)}" style="height:${Math.max(2,p.hist[k]/hmx*80)}px;background:${p.col}"></i>`).join('')}</div>${mdate(o).toLocaleDateString('pt-PT',{month:'short'})}</div>`).join('')}</div></div>`;
  return head+together+people
    +metric('Gasto este mês',p=>p.spent,v=>eur(v,0))
    +metric('Do orçamento usado',p=>p.budget>0?p.spent/p.budget*100:0,v=>Math.round(v)+'%',100)
    +metric('Média por dia',p=>p.spent/p.dayN,v=>eur(v))
    +metric('Taxa de poupança planeada',p=>p.inc>0?p.goal/p.inc*100:0,v=>Math.round(v)+'%')
    +metric('Poupado em objetivos',p=>p.saved,v=>eur(v,0))
    +metric('🔥 Dias seguidos dentro do limite',p=>p.streak,v=>v+' d')
    +`<div class="card"><h2>Por categoria</h2>${catRows||'<div class="mut">Sem gastos este mês.</div>'}</div>`+hist+syncCard;
}

let tvNote='',tvT=null;
let tvHi='',tvErr=false,tvS=0;
const TVC=['#34d399','#a78bfa'];
setInterval(()=>{if(ROLE==='tv'){tvS=(tvS+1)%3;render()}},20000);
function tvAgo(t){if(!t)return'—';const m=Math.round((Date.now()-t)/6e4);return m<1?'agora':m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'}
function tvView3(){
  syncLocalPeers();
  const ids=['nuno','anelise'],num=v=>Number.isFinite(+v)?+v:0,H=new Date().getHours(),P=ids.map(i=>PEERS[i]||{});
  
  const last=Math.max(0,...P.map(p=>num(p.upd))),sum=f=>P.reduce((s,p)=>s+f(p),0);
  const projOf=p=>num(p.spent)/Math.max(1,num(p.dayN))*Math.max(1,num(p.dim));
  const head=`<header class="zh"><div class="zw">POUPAR<button class="kback" onclick="goRole('lock')">🔒 Entrar com PIN</button></div><div class="zmo">${mlab(0)}</div><div class="zc"><b id="clk"></b><span>${new Date().toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'})}</span><em class="${tvErr?'bad':''}">● ${tvErr?'Sem ligação':(cloudOn?'Ligado · último registo há '+tvAgo(last):'Modo local · só vê este aparelho')}</em></div></header>`;
  const pan=(id,i)=>{const p=P[i],col=TVC[i];
    if(!p.mk)return `<section class="zp"><div class="zn2">${who(id)}</div><div class="zm">Ainda sem dados</div></section>`;
    const sp=num(p.spent),bu=num(p.budget),dn=Math.max(1,num(p.dayN)),dm=Math.max(1,num(p.dim)),pc=bu>0?sp/bu*100:0,ex=Math.min(100,dn/dm*100),left=num(p.left),fol=bu-projOf(p),R=46,C=2*Math.PI*R;
    const st=(l,v)=>`<div><span>${l}</span><b>${v}</b></div>`;
    const ring=`<svg viewBox="0 0 120 120" class="zr"><circle cx="60" cy="60" r="${R}" fill="none" stroke="#1e293b" stroke-width="10"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="${pc>ex+10?'#fb7185':col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*Math.min(1,pc/100)} ${C}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" fill="#f1f5f9" font-size="24" font-family="Instrument Serif,serif">${Math.round(pc)}%</text></svg>`;
    return `<section class="zp${tvHi===id?' hi':''}" style="--c:${col}"><div class="zn2"><i style="background:${col}">${who(id)[0]}</i>${who(id)}</div>
    <div class="zk"><div><div class="zl">Pode gastar hoje</div><div class="zbig" style="color:${left<0?'#fb7185':'#f1f5f9'};${eur(left,0).length>8?'font-size:calc(var(--u)*5)':eur(left,0).length>6?'font-size:calc(var(--u)*6)':''}">${eur(left,0)}</div></div>${ring}</div>
    <div class="zpr" style="background:${fol>=0?'rgba(52,211,153,.15)':'rgba(251,113,133,.15)'};color:${fol>=0?'#34d399':'#fb7185'}">${fol>=0?'Ao ritmo atual terminas o mês com '+eur(fol,0)+' de folga':'Ao ritmo atual excedes o orçamento em '+eur(-fol,0)}</div>
    <div class="zs">${st('Hoje',eur(num(p.sToday),0))}${st('Média/dia',eur(sp/dn,0))}${st('Dias seguidos',num(p.streak))}</div>
    <div class="zq">${(p.recent||[]).slice(0,3).map(e=>{const c=CATS[e.c]||CATS[5];return `<div><span>${c[0]} ${c[1]}</span><b>${eur(num(e.a))}</b></div>`}).join('')||'<div class="zm">Sem gastos recentes</div>'}</div></section>`};
  const leg=`<div class="zleg">${ids.map((id,i)=>`<span><i style="background:${TVC[i]}"></i>${who(id)}</span>`).join('')}</div>`;
  let body;
  if(tvS===0)body=`<div class="zg">${ids.map(pan).join('')}</div>`;
  else if(tvS===1){
    const cats=CATS.map((c,k)=>({c,v:P.map(p=>num(Array.isArray(p.cats)?p.cats[k]:0))})).filter(x=>x.v[0]+x.v[1]>0).sort((a,b)=>b.v[0]+b.v[1]-a.v[0]-a.v[1]).slice(0,6),mx=Math.max(1,...cats.flatMap(x=>x.v));
    body=`<div class="zcol"><div class="zt">Categorias do mês</div>${leg}${cats.map(x=>`<div class="zcr"><div>${x.c[0]} ${x.c[1]}</div><div>${x.v.map((v,i)=>`<div class="zbr"><div style="width:${v/mx*80}%;background:${TVC[i]}"></div><b>${eur(v,0)}</b></div>`).join('')}</div></div>`).join('')||'<div class="zm">Sem gastos este mês.</div>'}</div>`;
  }else{
    const hh=P.map(p=>[0,1,2,3,4,5].map(k=>num(Array.isArray(p.hist)?p.hist[k]:0))),hm=Math.max(1,...hh.flat());
    body=`<div class="zcol"><div class="zt">Últimos 6 meses</div>${leg}<div class="zhist">${[-5,-4,-3,-2,-1,0].map((o,k)=>`<div><div class="zbs">${hh.map((h,i)=>`<div class="zb" style="height:${Math.max(1,h[k]/hm*88)}%;background:${TVC[i]}"><em>${eur(h[k],0)}</em></div>`).join('')}</div><span>${mdate(o).toLocaleDateString('pt-PT',{month:'short'})}</span></div>`).join('')}</div></div>`;
  }
  const foot=`<footer class="zf"><div>Gasto juntos<b>${eur(sum(p=>num(p.spent)),0)}</b></div><div>Ainda livre<b>${eur(sum(p=>num(p.budget)-num(p.spent)),0)}</b></div><div>Projeção fim do mês<b>${eur(sum(projOf),0)}</b></div><div class="zd">${[0,1,2].map(k=>`<i style="cursor:pointer" onclick="tvS=${k};render()" class="${k===tvS?'on':''}"></i>`).join('')}</div></footer>`;
  return head+body+foot+(tvNote?`<div class="knote">${esc(tvNote)}</div>`:'');
}

function tick(){const e=$('clk');if(e)e.textContent=new Date().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}
setInterval(tick,1000);

/* Troca de perfil sem location.reload() para não causar ecrã em branco no Google Sites */
function goRole(r){
  GS.sSet('poupar-tmp',r);
  ROLE=(r==='lock')?'':r;
  if(ROLE&&ROLE!=='tv')loadProfileState();
  render();initCloud();
}
function setRole(r){
  GS.sDel('poupar-tmp');
  GS.set('poupar-role',r);
  ROLE=(r==='tv')?'tv':'';
  render();initCloud();
}

/* ---------- PIN de entrada ---------- */
let pinM='enter',pinV='',pinNew='',pinWho='',pinMsg='',PINS=null,pinLd=false;
async function pinHash(p,r){try{const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('poupar|'+r+'|'+p));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'p:'+r+':'+p}}
async function pinDoc(){try{const db=await getDb();return db?db.doc('poupar/pins'):null}catch(e){return null}}
async function pinLoad(){let d={};try{d=JSON.parse(GS.get('poupar-pins')||'{}')}catch(e){}
  try{const r=await pinDoc();if(r){const s=await r.get();if(s.exists)d=Object.assign(d,s.data()||{})}}catch(e){}PINS=d}
async function pinSave(role,pin){await pinLoad();PINS=Object.assign({},PINS,{[role]:await pinHash(pin,role)});
  GS.set('poupar-pins',JSON.stringify(PINS));
  try{const r=await pinDoc();if(r)await r.set(PINS)}catch(e){}}
async function chgPin(){const v=(($('np')||{}).value||'').trim();if(!/^\d{4}$/.test(v)){toast('O PIN tem 4 dígitos');return}await pinSave(ROLE,v);$('np').value='';toast('PIN guardado')}
function pinKey(k){if(k==='<')pinV=pinV.slice(0,-1);else if(pinV.length<4)pinV+=k;pinMsg='';if(pinV.length===4){const v=pinV;pinV='';pinDone(v)}else render()}
async function pinDone(v){
  if(pinM==='enter'){for(const r of['nuno','anelise']){if(PINS[r]&&PINS[r]===await pinHash(v,r)){goRole(r);return}}pinMsg='PIN errado. Tenta outra vez.';render()}
  else if(pinM==='new'){pinNew=v;pinM='confirm';render()}
  else if(pinM==='confirm'){if(v===pinNew){await pinSave(pinWho,v);goRole(pinWho)}else{pinM='new';pinMsg='Os PIN não coincidem.';render()}}
}
function pinGo(m,w){pinM=m;if(w)pinWho=w;pinV='';pinMsg='';render()}
function chooser(){
  if(PINS===null){if(!pinLd){pinLd=true;pinLoad().then(render)}return`<div class="chw"><div class="chb">POUPAR</div><div class="chs">A carregar…</div></div>`}
  if(pinM==='enter'&&!PINS.nuno&&!PINS.anelise)pinM='who';
  const nm={nuno:'Nuno',anelise:'Anelise'},free=['nuno','anelise'].filter(r=>!PINS[r]);
  const T={enter:'Introduz o teu PIN',who:'Quem és tu?',new:'Define o teu PIN',confirm:'Repete o PIN'}[pinM];
  const S2={enter:'Entras diretamente na tua página.',who:'Escolhe o teu perfil. Só o fazes uma vez.',new:'4 dígitos. Vais usá-lo sempre que abrires a app.',confirm:'Volta a escrever o mesmo PIN.'}[pinM];
  let b;
  if(pinM==='who')b=(free.length?free.map(r=>`<button class="chc" style="--c:${r==='nuno'?'#34d399':'#a78bfa'}" onclick="pinGo('new','${r}')"><i>${nm[r][0]}</i><div><b>${nm[r]}</b><span>Definir o meu PIN</span></div></button>`).join(''):'<div class="pmsg">Os dois perfis já têm PIN.</div>')+(PINS.nuno||PINS.anelise?'<button class="plk" onclick="pinGo(\'enter\')">Já tenho PIN</button>':'');
  else b=`<div class="pdots">${[0,1,2,3].map(i=>`<i class="${i<pinV.length?'on':''}"></i>`).join('')}</div><div class="pmsg">${pinMsg}</div><div class="pk">${[1,2,3,4,5,6,7,8,9,'',0,'<'].map(k=>k===''?'<span></span>':`<button onclick="pinKey('${k}')">${k==='<'?'⌫':k}</button>`).join('')}</div>`+(pinM==='enter'?'<button class="plk" onclick="pinGo(\'who\')">Ainda não tenho PIN</button>':'');
  return`<div class="chw"><div class="chb">POUPAR</div><h1 class="cht">${T}</h1><div class="chs">${S2}</div>${b}<button class="plk" onclick="goRole('tv')">📺 Ver Painel da Casa</button><button class="plk" onclick="setRole('tv')">Usar este aparelho como Painel da Casa</button></div>`;
}

function render(){
  if(!ROLE){$('nav').style.display='none';$('v').className='';$('v').innerHTML=chooser();return}
  if(ROLE==='tv'){document.documentElement.dataset.theme='dark';$('nav').style.display='none';$('v').className='tv';$('v').innerHTML=tvView3();tick();return}
  $('v').className='';
  if(S.theme)document.documentElement.dataset.theme=S.theme;
  else document.documentElement.dataset.theme='light';
  const c=calc();
  $('nav').style.display=S.ob?'flex':'none';
  $('v').innerHTML=(S.ob?({hoje,gastos,obj,casal,plano})[tab](c):onb());
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='amt'){e.preventDefault();$('amt').blur()}});
syncLocalPeers();
render();initCloud();
</script>
